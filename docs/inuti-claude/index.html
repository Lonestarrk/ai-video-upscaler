<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Inuti Claude</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a die shot on a dark silicon ground, zoomable canvas on the left, a spec-sheet panel on the right (below on phones). */
:root {
  --bg: #0f1517;
  --surface: #151d20;
  --surface-2: #1b2529;
  --line: #2a373c;
  --fg: #e1e8ea;
  --muted: #93a4ab;
  --accent: #d8b24a;
  --accent-ink: #1a1508;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; overflow: hidden; }
.app { height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 12px; gap: 10px; box-sizing: border-box; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; flex-wrap: wrap; }
.brand h1 { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: .01em; margin: 0; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.stage { flex: 1; min-height: 0; display: flex; gap: 12px; }
.viewport { position: relative; flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); touch-action: none; }
canvas { display: block; width: 100%; height: 100%; cursor: grab; }
canvas.dragging { cursor: grabbing; }
.hud { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; align-items: center; }
.hud .zoom { font-family: var(--font-mono); font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--bg) 82%, transparent); padding: 4px 8px; border-radius: 5px; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.hud button { width: 30px; height: 30px; padding: 0; font-size: 16px; line-height: 1; }
.hint { position: absolute; left: 10px; top: 10px; font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--bg) 82%, transparent); padding: 4px 8px; border-radius: 5px; border: 1px solid var(--line); max-width: calc(100% - 200px); }
.tip { position: absolute; pointer-events: none; font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
.tourbar { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 10px; background: color-mix(in srgb, var(--surface) 94%, transparent); border: 1px solid var(--accent); border-radius: 8px; padding: 8px 10px; }
.tourbar .step { font-family: var(--font-mono); font-size: 12px; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tourbar .cap { flex: 1; min-width: 0; font-size: 14px; }
.panel { width: 380px; flex: none; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px 24px; box-sizing: border-box; }
.crumbs { display: flex; flex-wrap: wrap; gap: 2px 4px; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
.crumbs button { background: none; border: none; padding: 0 2px; color: var(--muted); font-size: 12px; border-radius: 3px; }
.crumbs button:hover { color: var(--fg); }
.crumbs .sep { opacity: .5; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.panel h2 { font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 1.1; margin: 6px 0 4px; text-wrap: balance; }
.panel .sub { color: var(--muted); margin: 0 0 14px; }
.panel .note { border-left: 2px solid var(--accent); padding-left: 10px; margin: 0 0 12px; }
.panel p { margin: 0 0 10px; }
.cpu { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin: 14px 0; font-size: 14px; }
.cpu b { display: block; font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 500; margin-bottom: 2px; }
dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 14px 0; font-size: 13px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; font-family: var(--font-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; min-width: 0; }
.panel h3 { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 20px 0 8px; }
.kids { display: flex; flex-direction: column; gap: 4px; }
.kids button { display: flex; align-items: center; gap: 8px; text-align: left; background: var(--surface-2); }
.kids button span.n { color: var(--muted); margin-left: auto; font-family: var(--font-mono); font-size: 11px; }
.scale { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-top: 6px; }
.leafmark { color: var(--muted); font-size: 13px; font-style: italic; }
@media (max-width: 760px) {
  .stage { flex-direction: column; }
  .viewport { flex: 1 1 55%; }
  .panel { width: auto; flex: 1 1 45%; padding: 14px 14px 20px; }
  .panel h2 { font-size: 23px; }
  .brand p { display: none; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>Inuti <span>Claude</span></h1>
      <p>En zoombar karta över en språkmodell, från helheten ner till en enda transistor.</p>
    </div>
    <div class="tools">
      <button id="tourBtn" class="primary" type="button">Guidad tur</button>
      <button id="upBtn" type="button">Zooma ut ett steg</button>
      <button id="homeBtn" type="button">Helheten</button>
    </div>
  </header>
  <main class="stage">
    <div class="viewport" id="vp">
      <canvas id="cv" aria-label="Zoombar karta över Claudes delar"></canvas>
      <div class="hint">Scrolla eller nyp för att zooma · dra för att flytta · klicka på en del för att gå in i den</div>
      <div class="hud">
        <span class="zoom" id="zoomLbl">×1</span>
        <button id="zin" type="button" aria-label="Zooma in">+</button>
        <button id="zout" type="button" aria-label="Zooma ut">−</button>
      </div>
      <div class="tip" id="tip" hidden></div>
      <div class="tourbar" id="tourbar" hidden>
        <button id="tPrev" type="button" aria-label="Föregående steg">‹</button>
        <span class="step" id="tStep">1/1</span>
        <span class="cap" id="tCap"></span>
        <button id="tNext" type="button" class="primary">Nästa ›</button>
        <button id="tEnd" type="button" aria-label="Avsluta turen">✕</button>
      </div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
</div>

<script>
"use strict";
/* ================= palette ================= */
const BG = "#0f1517";
const CATS = {
  root:  ["#a9b6bd", "Hela modellen"],
  ctx:   ["#cdb98c", "Indata"],
  tok:   ["#d89d5e", "Tokenisering"],
  emb:   ["#cc8463", "Inbäddning"],
  stack: ["#7f9db2", "Transformer"],
  res:   ["#d8b24a", "Residualström"],
  feat:  ["#e3c766", "Tolkning"],
  attn:  ["#4fb3aa", "Uppmärksamhet"],
  mlp:   ["#c77a9b", "MLP"],
  norm:  ["#8e9aa6", "Normalisering"],
  out:   ["#9d8bd2", "Utdata"],
  samp:  ["#b9a0e3", "Sampling"],
  cache: ["#6896db", "Minne"],
  train: ["#9fbb66", "Träning"],
  math:  ["#62b6d2", "Matematik"],
  num:   ["#d6ab5e", "Tal och bitar"],
  hw:    ["#a6b0ba", "Hårdvara"],
  gate:  ["#93c0a4", "Logik"],
  xtor:  ["#a3aab0", "Transistor"],
  diff:  ["#7fb069", "Transistor"],
  poly:  ["#d3655b", "Transistor"],
  oxide: ["#cfc7a8", "Transistor"],
  chan:  ["#e0bb4e", "Transistor"],
};
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixc = (a, b, t) => { const A = hex(a), B = hex(b); return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",") + ")"; };
const PAL = {};
for (const k in CATS) {
  const c = CATS[k][0];
  PAL[k] = { c, f0: mixc(BG, c, 0.11), f1: mixc(BG, c, 0.19), b: mixc(BG, c, 0.72), t: mixc(c, "#ffffff", 0.25), dim: mixc(BG, c, 0.45) };
}
const FC = '"IBM Plex Sans Condensed", "Arial Narrow", sans-serif';
const FM = '"IBM Plex Mono", ui-monospace, monospace';
const FS = '"IBM Plex Sans", system-ui, sans-serif';

/* ================= model of the map ================= */
let SEED = 1;
function N(name, cat, sub, body, o = {}) { return Object.assign({ name, cat, sub, body, kids: [], links: null }, o); }
function K(n, r, o = {}) { return Object.assign({ n, r, seed: SEED++ }, o); }
function grid(n, cols, rows, area, make, g = 0.1, bottomUp = false) {
  const out = [], cw = area[2] / cols, ch = area[3] / rows;
  for (let i = 0; i < n; i++) {
    const c = i % cols, r0 = Math.floor(i / cols), r = bottomUp ? rows - 1 - r0 : r0;
    out.push(make(i, [area[0] + c * cw + cw * g / 2, area[1] + r * ch + ch * g / 2, cw * (1 - g), ch * (1 - g)]));
  }
  return out;
}

/* ---- transistor level ---- */
const tSource = N("Source", "diff", "Där elektronerna kommer in", [
  "Ett dopat område i kislet som är kopplat till ena sidan av strömbrytaren. Härifrån flyttar sig elektronerna över till drain när kanalen är öppen."]);
const tDrain = N("Drain", "diff", "Där elektronerna lämnar", [
  "Motsvarande område på andra sidan. Spänningsskillnaden mellan source och drain driver strömmen när transistorn leder."]);
const tGate = N("Gate (styret)", "poly", "Den del som slår av och på", [
  "En elektrod ovanför kanalen. Lägger man spänning här dras laddningar till ytan under den och en ledande bana bildas. Ingen spänning: banan försvinner och strömmen stängs av.",
  "Det är hela tricket bakom all digital elektronik, AI inräknad: en spänning styr en annan ström."]);
const tOxide = N("Gateoxid", "oxide", "Isolerande skikt, några atomlager tjockt", [
  "Ett mycket tunt isolerande lager mellan styret och kislet. Det låter styret påverka kanalen med sitt elektriska fält utan att någon ström läcker igenom."]);
const tChan = N("Kanal", "chan", "Här bildas den ledande banan", [
  "Området i kislet precis under styret. När styret har spänning blir det ledande och transistorn är 'på' (en 1:a). Annars är det isolerande (en 0:a)."]);
const Transistor = N("Transistor (MOSFET)", "xtor", "En elektriskt styrd strömbrytare", [
  "Botten på kartan. Spänning på styret skapar en ledande kanal mellan source och drain och strömmen går. Utan spänning är den avstängd. På och av blir 1 och 0.",
  "Det finns ingen särskild 'AI-transistor'. Det är exakt samma komponent som i din dators processor, bara ordnad för att multiplicera tal väldigt många gånger parallellt.",
  "Ritningen är ett förenklat tvärsnitt av en plan transistor. Moderna chip använder 3D-varianter (FinFET och gate-all-around) men principen är densamma."], {
  cpu: "Samma transistor som i en vanlig CPU. Här möts AI och vanlig dator helt.",
  facts: [["Storlek", "detaljer på några nanometer"], ["NVIDIA H100", "80 miljarder transistorer"], ["NVIDIA B200", "208 miljarder transistorer"], ["Kopplar", "miljarder gånger per sekund"]],
  draw: "substrate",
});
Transistor.kids = [K(tGate, [0.30, 0.02, 0.40, 0.26]), K(tOxide, [0.30, 0.31, 0.40, 0.09]), K(tSource, [0.0, 0.46, 0.27, 0.44]), K(tChan, [0.30, 0.46, 0.40, 0.18]), K(tDrain, [0.73, 0.46, 0.27, 0.44])];

/* ---- logic gate ---- */
const Truth = N("Sanningstabell", "gate", "NAND: 0 bara när båda ingångarna är 1", [
  "A=0 B=0 → 1, A=0 B=1 → 1, A=1 B=0 → 1, A=1 B=1 → 0."], { draw: "table" });
const Gate = N("Logikgrind (NAND)", "gate", "Fyra transistorer som gör logik", [
  "Det minsta logiska byggblocket. NAND ger 0 bara när båda ingångarna är 1. Alla andra funktioner, AND, XOR, adderare och hela multiplikatorer, kan byggas av enbart NAND-grindar.",
  "En CMOS-NAND har fyra transistorer: två PMOS parallellt mot matningsspänningen och två NMOS i serie mot jord. Klicka på en av dem för att se transistorn."], {
  cpu: "Identisk med grindarna i en CPU.",
  facts: [["Transistorer", "4"], ["Funktion", "Y = ¬(A ∧ B)"]],
});
Gate.kids = [
  K(Transistor, [0, 0, 0.3, 0.45], { label: "PMOS 1" }), K(Transistor, [0.34, 0, 0.3, 0.45], { label: "PMOS 2" }),
  K(Transistor, [0, 0.55, 0.3, 0.45], { label: "NMOS 1" }), K(Transistor, [0.34, 0.55, 0.3, 0.45], { label: "NMOS 2" }),
  K(Truth, [0.70, 0, 0.30, 1])];

/* ---- MAC unit ---- */
const Multiplier = N("Multiplikator", "gate", "a · b med grindar", [
  "Multiplicerar två tal genom att bilda delprodukter bit för bit (med AND) och summera dem i ett träd av adderare. För flyttal multipliceras mantissorna och exponenterna adderas."]);
Multiplier.kids = grid(16, 4, 4, [0, 0, 1, 1], (i, r) => K(Gate, r, { label: "Grind " + (i + 1) }));
const Adder = N("Adderare", "gate", "Lägger till delsumman", [
  "Summerar två tal bit för bit med minnessiffra (carry). En heladderare är några XOR-, AND- och OR-grindar, som i sin tur kan byggas av NAND."]);
Adder.kids = grid(8, 2, 4, [0, 0, 1, 1], (i, r) => K(Gate, r, { label: "Grind " + (i + 1) }));
const Register = N("Ackumulatorregister", "gate", "Håller delsumman", [
  "Sparar summan mellan varven: summa ← summa + a·b. Byggt av vippor, som är grindar kopplade i en slinga så att de minns en bit."], { draw: "sym", sym: "Σ" });
const MAC = N("MAC-enhet", "hw", "Multiplicera och addera: a · b + c", [
  "Hårdvarublocket som gör allt jobb i en AI: ta två tal, multiplicera dem och lägg till en löpande summa.",
  "Ett AI-chip har tiotusentals sådana som arbetar i takt, ofta i ett rutnät (en systolisk matris) där tal pumpas igenom från två håll och delsummor vandrar vidare till grannen."], {
  cpu: "Samma FMA-instruktion (fused multiply-add) som CPU:ns flyttalsenhet har, men i tusentals exemplar.",
  facts: [["Operation", "c ← c + a·b"], ["Per klockcykel", "1 per enhet"]],
  links: [[0, 1], [1, 2]],
});
MAC.kids = [K(Multiplier, [0, 0, 0.46, 1]), K(Adder, [0.51, 0, 0.27, 1]), K(Register, [0.83, 0, 0.17, 1])];

/* ---- bits and memory ---- */
const Capacitor = N("Kondensator", "num", "Håller en liten laddning", [
  "Laddad betyder 1, urladdad betyder 0. Laddningen läcker sakta, så minnet måste läsas och skrivas om (uppdateras) många gånger per sekund. Det är det D:et i DRAM står för: dynamiskt."], { draw: "cap" });
const Bit = N("En bit", "num", "0 eller 1, lagrad i en minnescell", [
  "Det minsta som går att lagra. I acceleratorns minne (HBM, en sorts DRAM) är en bit en laddning i en liten kondensator, med en transistor som grind för att läsa och skriva den.",
  "Det är alltså samma sorts minnescell som i datorns RAM."], {
  cpu: "Precis som RAM i en vanlig dator: en transistor och en kondensator per bit.",
  facts: [["DRAM-cell", "1 transistor + 1 kondensator"]],
});
Bit.kids = [K(Transistor, [0, 0, 0.5, 1], { label: "Åtkomsttransistor" }), K(Capacitor, [0.55, 0, 0.45, 1])];

const WBITS = { s: [1], e: [0, 1, 1, 1, 1, 0, 0, 1], m: [0, 1, 0, 1, 1, 1, 0] };
const SignG = N("Teckenbit", "num", "1 = negativt tal", ["En bit som säger om talet är positivt eller negativt. Här 1: vikten är negativ."]);
SignG.kids = [K(Bit, [0, 0, 1, 1], { label: "Teckenbit", glyph: "1" })];
const ExpG = N("Exponent (8 bitar)", "num", "Talets storleksordning", [
  "Säger var decimalkommat hamnar, som tiopotensen i 2,13 · 10⁻², fast i basen 2. Här 01111001 = 121, och 121 − 127 = −6, alltså × 2⁻⁶."]);
ExpG.kids = grid(8, 8, 1, [0, 0, 1, 1], (i, r) => K(Bit, r, { label: "Exponentbit " + (7 - i), glyph: String(WBITS.e[i]) }), 0.12);
const ManG = N("Mantissa (7 bitar)", "num", "Talets siffror", [
  "De signifikanta siffrorna. Med en underförstådd etta framför blir 1,0101110 i binärt ungefär 1,36. Och 1,36 × 2⁻⁶ ≈ 0,0213."]);
ManG.kids = grid(7, 7, 1, [0, 0, 1, 1], (i, r) => K(Bit, r, { label: "Mantissabit " + (6 - i), glyph: String(WBITS.m[i]) }), 0.12);
const WMem = N("Var vikten bor", "cache", "I HBM-minnet bredvid beräkningschipet", [
  "Alla vikter ligger i acceleratorns högbandbreddsminne. För varje nytt token måste i princip alla vikter läsas därifrån, så minnets hastighet sätter ofta taket för hur fort Claude skriver."]);
const Weight = N("En vikt (parameter)", "num", "Ett enda inlärt tal, här −0,0213", [
  "Ett tal. Claude har miljarder sådana, och tillsammans är de allt modellen kan. Det finns inga regler eller faktarader någonstans, bara de här talen.",
  "Under träningen justeras varje vikt en liten aning, miljontals gånger, åt det håll som gör förutsägelserna bättre.",
  "Vikter lagras ofta i 16-bitarsformatet bfloat16: 1 teckenbit, 8 exponentbitar och 7 mantissabitar. Vid körning komprimeras de ibland till 8 eller 4 bitar. Vilket format Claude använder är inte offentligt; exemplet visar bfloat16."], {
  cpu: "Ett ord i minnet. Samma bitar, samma minne som i en vanlig dator.",
  facts: [["Exempelvärde", "−0,0213"], ["bfloat16", "1 10111100 1 0101110"], ["Bitar", "16 (2 byte)"]],
});
Weight.kids = [K(SignG, [0, 0, 0.09, 0.56]), K(ExpG, [0.12, 0, 0.47, 0.56]), K(ManG, [0.62, 0, 0.38, 0.56]), K(WMem, [0, 0.66, 1, 0.34])];

/* ---- dot product and matrix multiply ---- */
const InVec = N("Indatavektor", "math", "Tokenens tal just nu", [
  "Tokenens aktuella vektor efter normalisering. Samma vektor multipliceras mot varje rad vikter i matrisen."], { draw: "vector" });
const SumOut = N("Utdata", "math", "Ett enda tal", [
  "Resultatet av skalärprodukten: ett tal i nästa vektor. En matrismultiplikation producerar tusentals sådana på en gång."], { draw: "sym", sym: "y" });
const Dot = N("Skalärprodukt", "math", "y = w₁x₁ + w₂x₂ + … + wₙxₙ", [
  "Den minsta meningsfulla beräkningen: multiplicera varje indatatal med sin vikt och summera. Det är precis vad en artificiell 'neuron' gör.",
  "Vikterna (w) är det modellen har lärt sig. Indata (x) är tokenens nuvarande vektor. I verkligheten är n tusentals tal långt; här visas 8.",
  "I hårdvaran görs summan av MAC-enheter som tar en multiplikation och en addition per klockslag."], {
  cpu: "En loop av FMA-instruktioner: c = c + w·x, om och om igen.",
  facts: [["Längd i stora modeller", "tusentals termer"], ["Operationer", "1 multiplikation + 1 addition per term"]],
});
Dot.kids = [
  K(InVec, [0, 0, 1, 0.2]),
  ...grid(8, 8, 1, [0, 0.26, 1, 0.24], (i, r) => K(Weight, r, { label: "w" + (i + 1) }), 0.1),
  ...grid(4, 4, 1, [0, 0.56, 0.82, 0.44], (i, r) => K(MAC, r, { label: "MAC " + (i + 1) }), 0.1),
  K(SumOut, [0.85, 0.56, 0.15, 0.44])];

const Matmul = N("Matrismultiplikation", "math", "Den verkliga arbetshästen", [
  "Nästan all beräkning i Claude är matrismultiplikation: tokenvektorer gånger en viktmatris. Varje ruta här är en skalärprodukt mellan indata och en rad vikter, och ger ett tal i utdata.",
  "En enda matris i en stor modell kan ha tiotals miljoner vikter. Det är därför AI körs på GPU:er och TPU:er: de är byggda för att göra tusentals multiplikationer samtidigt."], {
  cpu: "En SIMD- eller vektorenhet: samma operation på väldigt många tal samtidigt.",

function drawNode(e, x, y, w, h, depth, labelOK) {

function outline(path, color, lw) {

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = BG; ctx.fillRect(0, 0, VW, VH);
  const r = toScreen(ROOT_RECT);
  drawNode(ROOTE, r[0], r[1], r[2], r[3], 0, true);
  if (hoverPath && !samePath(hoverPath, selPath)) outline(hoverPath, "rgba(225,232,234,.75)", 1.5);
  if (selPath.length) outline(selPath, PAL.res.c, 2);

function frame() { if (dirty) { dirty = false; render(); } requestAnimationFrame(frame); }

/* ================= hit testing ================= */
function hit(px, py) {
  let e = ROOTE, path = [], r = toScreen(ROOT_RECT);
  if (px < r[0] || py < r[1] || px > r[0] + r[2] || py > r[1] + r[3]) return null;
  for (;;) {
    const m = Math.min(r[2], r[3]);
    if (m < DETAIL || !e.n.kids.length) break;
    const L = inner(...r);
    let found = -1, fr = null;
    e.n.kids.forEach((k, i) => { const c = childRect(L, k.r); if (px >= c[0] && px <= c[0] + c[2] && py >= c[1] && py <= c[1] + c[3]) { found = i; fr = c; } });
    if (found < 0) break;

}
const samePath = (a, b) => a && b && a.length === b.length && a.every((v, i) => v === b[i]);

/* ================= camera animation (smooth zoom, van Wijk & Nuij) ================= */
let anim = null;
function interpZoom(p0, p1) {
  const w0 = p0[2], ux0 = 0, uy0 = 0, dx = (p1[0] - p0[0]) / w0, dy = (p1[1] - p0[1]) / w0, w1 = p1[2] / w0;
  const rho = Math.SQRT2, rho2 = 2, rho4 = 4, d2 = dx * dx + dy * dy;
  let S, f;
  if (d2 < 1e-12) { S = Math.log(w1) / rho; f = t => [t * dx, t * dy, Math.exp(rho * t * S)]; }
  else {
    const d1 = Math.sqrt(d2), b0 = (w1 * w1 - 1 + rho4 * d2) / (2 * rho2 * d1), b1 = (w1 * w1 - 1 - rho4 * d2) / (2 * w1 * rho2 * d1);
    const r0 = Math.log(Math.sqrt(b0 * b0 + 1) - b0), r1 = Math.log(Math.sqrt(b1 * b1 + 1) - b1);
    S = (r1 - r0) / rho;
    f = t => { const s = t * S, u = 1 / (rho2 * d1) * (Math.cosh(r0) * Math.tanh(rho * s + r0) - Math.sinh(r0)); return [u * dx, u * dy, Math.cosh(r0) / Math.cosh(rho * s + r0)]; };
  }
  return { S: Math.abs(S), at: t => { const v = f(t); return [p0[0] + v[0] * w0, p0[1] + v[1] * w0, v[2] * w0]; } };
}
function flyTo(target) {
  if (reduceMotion) { Object.assign(cam, target); dirty = true; return; }
  const iz = interpZoom([cam.x, cam.y, VW / cam.k], [target.x, target.y, VW / target.k]);
  const dur = Math.max(380, Math.min(2400, iz.S * 520));
  const t0 = performance.now();
  anim = { iz, t0, dur, target };
  const step = now => {
    if (!anim || anim.t0 !== t0) return;
    let t = Math.min(1, (now - t0) / dur);
    t = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const v = iz.at(t);
    cam.x = v[0]; cam.y = v[1]; cam.k = VW / v[2];
    if ((now - t0) >= dur) { Object.assign(cam, target); anim = null; }
    dirty = true;
    if (anim) requestAnimationFrame(step);

}

/* ================= panel ================= */
const panel = document.getElementById("panel");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function scaleText(path) {
  const r = worldRect(path), ratio = ROOT_RECT[2] / r[2];
  if (ratio < 1.5) return "";
  const f = ratio < 100 ? ratio.toFixed(0) : Math.round(ratio).toLocaleString("sv-SE");
  return `Den här delen är ungefär 1/${f} av helhetens bredd.`;
}
function renderPanel() {
  const path = selPath, e = entryAt(path), n = e.n, cat = CATS[n.cat];
  let crumbs = "";

  }

    });

  } else {

    <div class="eyebrow" style="color:${PAL[n.cat].t}"><span class="dot" style="background:${cat[0]}"></span>${esc(cat[1])} · nivå ${path.length}</div>

function kidBtn(k, path, name, extra) {

panel.addEventListener("click", ev => {

function select(path, fly = true) {

/* ================= input ================= */
const tip = document.getElementById("tip");
const pointers = new Map();
let down = null, pinch = null;
function zoomAt(px, py, f) {
  anim = null;
  const wx = (px - VW / 2) / cam.k + cam.x, wy = (py - VH / 2) / cam.k + cam.y;
  cam.k = Math.max(kRoot * 0.5, Math.min(kRoot * 5e9, cam.k * f));
  cam.x = wx - (px - VW / 2) / cam.k; cam.y = wy - (py - VH / 2) / cam.k; dirty = true;
}
const local = ev => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
cv.addEventListener("wheel", ev => { ev.preventDefault(); const [x, y] = local(ev); zoomAt(x, y, Math.exp(-ev.deltaY * (ev.deltaMode ? 0.05 : 0.0018))); }, { passive: false });
cv.addEventListener("pointerdown", ev => {
  cv.setPointerCapture(ev.pointerId);
  const [x, y] = local(ev); pointers.set(ev.pointerId, [x, y]);
  if (pointers.size === 1) down = { x, y, t: performance.now(), moved: 0 };
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) }; if (down) down.moved = 99; }
});
cv.addEventListener("pointermove", ev => {

    }

  }

    if (down) down.moved += Math.abs(x - prev[0]) + Math.abs(y - prev[1]);
    if (down && down.moved > 6) cv.classList.add("dragging");
  } else if (pointers.size === 2 && pinch) {
    const [a, b] = [...pointers.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);

});
function endPointer(ev) {

cv.addEventListener("pointercancel", endPointer);

function goUp() { if (selPath.length) select(selPath.slice(0, -1)); else select([]); }

document.getElementById("upBtn").onclick = goUp;
document.getElementById("zin").onclick = () => zoomAt(VW / 2, VH / 2, 1.8);
document.getElementById("zout").onclick = () => zoomAt(VW / 2, VH / 2, 1 / 1.8);
addEventListener("keydown", ev => {
  if (ev.target.closest && ev.target.closest("input,textarea")) return;
  if (ev.key === "Escape" || ev.key === "Backspace") { ev.preventDefault(); if (tourIdx >= 0) endTour(); else goUp(); }
  else if (tourIdx >= 0 && ev.key === "ArrowRight") tourGo(tourIdx + 1);
  else if (tourIdx >= 0 && ev.key === "ArrowLeft") tourGo(tourIdx - 1);

});

/* ================= guided tour ================= */
function findPath(names) {
  const path = []; let e = ROOTE;

    const i = e.n.kids.findIndex(k => titleOf(k) === nm);
    if (i < 0) throw new Error("tour: " + nm);
    path.push(i); e = e.n.kids[i];
  }
  return path;
}

  [["Tokeniseraren", "Token “␣fung”"], "Ett token. Efter det här steget finns inga bokstäver kvar."],
